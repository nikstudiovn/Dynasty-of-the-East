name: PixelDynasty
options:
  bundleIdPrefix: com.nikstudio
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PixelDynasty:
    type: application
    platform: iOS
    sources:
      - path: PixelDynasty
        excludes:
          - WebBundle
      - path: PixelDynasty/WebBundle
        type: folder
    info:
      path: PixelDynasty/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikstudio.pixeldynasty
        PRODUCT_NAME: Pixel Dynasty
        INFOPLIST_FILE: PixelDynasty/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
    frameworks:
      - sdk: WebKit.framework
      - sdk: Network.framework
      - sdk: GameKit.framework
      - sdk: CoreHaptics.framework

schemes:
  PixelDynasty:
    build:
      targets:
        PixelDynasty: all
    run:
      config: Debug
    archive:
      config: Release
